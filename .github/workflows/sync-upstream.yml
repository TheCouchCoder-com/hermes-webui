name: Sync Upstream

# Walk forward through nesquena/hermes-webui tags one stage at a time.
# - Runs daily 06:00 UTC, plus manual dispatch. Daily cadence paired with
#   the daily Claude conflict-resolution routine keeps the fork close to
#   upstream; weekly was too slow given upstream's ~3-tag/week pace.
# - Scheduled runs jump straight to the newest un-merged upstream `v*` tag
#   (`mode: latest`) so the fork doesn't fall perpetually behind crawling
#   one tag a day (see CLAUDE.md → Syncing with upstream).
# - Manual dispatch honors the `mode` input (default `next` = advance one
#   tag for a small, bisectable merge; `latest` = skip ahead to the tip).
# - If the merge applies cleanly AND tests pass, opens a ready-for-review
#   PR. Otherwise opens a draft PR with the conflict / failure state so a
#   human (or Claude) can resolve it.
#
# This workflow only runs on the fork (TheCouchCoder-com/hermes-webui),
# matching the guard pattern used in release.yml.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Specific upstream tag to merge (e.g. v0.51.15). Leave blank to use `mode`.'
        required: false
        type: string
      mode:
        description: 'Tag selection when `target_tag` is blank. `next` = next un-merged tag (default, stage-by-stage). `latest` = newest upstream tag, skipping intermediates.'
        required: false
        type: choice
        default: next
        options:
          - next
          - latest

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    if: github.repository == 'TheCouchCoder-com/hermes-webui'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/nesquena/hermes-webui.git
          git fetch upstream master --tags --prune

      - name: Pick upstream tag
        id: pick
        run: |
          set -euo pipefail
          # Scheduled runs send no `mode` input → default to `latest` so the
          # fork catches up to upstream's tip instead of crawling one tag a
          # day. Manual dispatch always supplies the choice input (default
          # `next`), which is honored as-is.
          MODE="${{ inputs.mode }}"
          MODE="${MODE:-latest}"
          if [ -n "${{ inputs.target_tag }}" ]; then
            TAG="${{ inputs.target_tag }}"
            echo "Using user-specified tag: $TAG"
          else
            # Tags that are on upstream/master's history but not yet in our master.
            # `--no-merged master` alone would include ancient side-branch tags that
            # upstream itself never merged (e.g. v0.12); intersecting with
            # `--merged upstream/master` filters those out.
            UNMERGED=$(git tag --merged upstream/master --no-merged master --list 'v*' --sort=v:refname || true)
            if [ "$MODE" = "latest" ]; then
              TAG=$(echo "$UNMERGED" | tail -n1)
              echo "Latest un-merged upstream tag: ${TAG:-<none>}"
            else
              TAG=$(echo "$UNMERGED" | head -n1)
              echo "Next un-merged upstream tag: ${TAG:-<none>}"
            fi
          fi
          if [ -z "$TAG" ]; then
            echo "No upstream tags to merge. Exiting cleanly."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse "$TAG^{commit}" >/dev/null 2>&1; then
            echo "::error ::Tag $TAG not found after fetch"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "branch=sync/upstream-$TAG" >> "$GITHUB_OUTPUT"

      - name: Bail if no tag to sync
        if: steps.pick.outputs.tag == ''
        run: echo "Nothing to sync — fork is already up to date."

      - name: Check for existing sync branch on origin
        if: steps.pick.outputs.tag != ''
        id: branch_check
        run: |
          set -euo pipefail
          BRANCH="${{ steps.pick.outputs.branch }}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::notice ::Sync branch $BRANCH already exists on origin — skipping. Resolve or delete that branch first."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create sync branch and merge
        if: steps.pick.outputs.tag != '' && steps.branch_check.outputs.skip != 'true'
        id: merge
        run: |
          set +e
          BRANCH="${{ steps.pick.outputs.branch }}"
          TAG="${{ steps.pick.outputs.tag }}"
          git checkout -b "$BRANCH"
          git merge --no-ff --no-edit "$TAG"

          # The default GITHUB_TOKEN has no `workflows` permission, so it cannot
          # push commits that create or modify files under .github/workflows/.
          # The fork runs its own CI, so we always discard upstream's workflow
          # edits and keep ours by resetting the directory to master's version.
          # This also clears any merge conflict in those files.
          # (See CLAUDE.md → Syncing with upstream.)
          rm -rf .github/workflows
          git checkout master -- .github/workflows
          git add -A .github/workflows

          # Recompute conflicts after dropping workflow files.
          CONFLICTS=$(git diff --name-only --diff-filter=U | tr '\n' ',' | sed 's/,$//')
          if [ -n "$CONFLICTS" ]; then
            echo "Merge produced conflicts: $CONFLICTS"
            echo "conflicts=$CONFLICTS" >> "$GITHUB_OUTPUT"
            git add -A
            git commit -m "merge upstream $TAG (conflicts unresolved)"
            echo "merge_status=conflict" >> "$GITHUB_OUTPUT"
          else
            # Either a fully clean merge, or the only conflicts were workflow
            # files we just dropped. Finalize the merge commit if one is still
            # pending (a clean `git merge` already committed it).
            if [ -f .git/MERGE_HEAD ]; then
              git commit --no-edit
            fi
            echo "merge_status=clean" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Set up Python (only if merge applied cleanly)
        if: steps.merge.outputs.merge_status == 'clean'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run tests
        if: steps.merge.outputs.merge_status == 'clean'
        id: tests
        run: |
          set +e
          python -m pip install --upgrade pip
          pip install pyyaml>=6.0 pytest pytest-timeout
          pytest tests/ -q --timeout=60
          echo "tests_status=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Push sync branch
        if: steps.pick.outputs.tag != '' && steps.branch_check.outputs.skip != 'true'
        run: |
          git push -u origin "${{ steps.pick.outputs.branch }}"

      - name: Open PR
        if: steps.pick.outputs.tag != '' && steps.branch_check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TAG: ${{ steps.pick.outputs.tag }}
          PR_BRANCH: ${{ steps.pick.outputs.branch }}
          PR_MERGE_STATUS: ${{ steps.merge.outputs.merge_status }}
          PR_TESTS_STATUS: ${{ steps.tests.outputs.tests_status || 'skipped' }}
          PR_CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        run: |
          set -euo pipefail
          if [ "$PR_MERGE_STATUS" = "clean" ] && [ "$PR_TESTS_STATUS" = "0" ]; then
            DRAFT_FLAG=""
            TITLE="sync: upstream $PR_TAG"
            STATE_HEADER="**Clean merge, tests green.** Ready for review."
            REASON=""
          else
            DRAFT_FLAG="--draft"
            TITLE="sync: upstream $PR_TAG (needs review)"
            STATE_HEADER="**Needs human review.**"
            REASON=""
            if [ "$PR_MERGE_STATUS" = "conflict" ]; then
              REASON="${REASON}\n- Conflicts in: ${PR_CONFLICTS}"
            fi
            if [ "$PR_TESTS_STATUS" != "0" ] && [ "$PR_TESTS_STATUS" != "skipped" ]; then
              REASON="${REASON}\n- pytest exited with status ${PR_TESTS_STATUS}"
            fi
          fi

          # Ensure the label exists. `--force` keeps this idempotent across runs.
          # We intentionally do NOT pass --label to `gh pr create` below — when the
          # GITHUB_TOKEN can't yet see a freshly created label (eager consistency
          # gap), the create call fails with "label not found" and aborts the PR.
          # Applying the label as a separate edit step after the PR exists is the
          # documented workaround.
          #
          # `--repo` is pinned on every gh call: once `upstream` is added as a git
          # remote (above), gh's auto-detection prefers it over `origin`, which
          # would target `nesquena/hermes-webui` and fail (no write access).
          gh label create sync-upstream \
            --repo "$GITHUB_REPOSITORY" \
            --description 'PRs from .github/workflows/sync-upstream.yml' \
            --color 5319E7 \
            --force

          {
            printf 'Auto-generated by `.github/workflows/sync-upstream.yml`.\n\n'
            printf 'Merging upstream tag **%s** from `nesquena/hermes-webui` into `master`.\n\n' "$PR_TAG"
            printf '%s' "$STATE_HEADER"
            printf '%b\n\n' "$REASON"
            printf 'See `CLAUDE.md` → *Syncing with upstream* for the conflict playbook.\n\n'
            printf '### Validation\n'
            printf -- '- Merge: `%s`\n' "$PR_MERGE_STATUS"
            printf -- '- Tests: `%s` (0 = pass; `skipped` = not run because merge had conflicts)\n\n' "$PR_TESTS_STATUS"
            printf '### Next step\n'
            printf -- '- Squash-merge is **forbidden** — keep the merge commit so future syncs see the correct merge-base.\n'
            printf -- '- After merge, the next workflow run will pick up the tag after `%s`.\n' "$PR_TAG"
          } > /tmp/pr-body.md

          PR_URL=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base master \
            --head "$PR_BRANCH" \
            --title "$TITLE" \
            --body-file /tmp/pr-body.md \
            $DRAFT_FLAG)

          echo "Created: $PR_URL"
          gh pr edit "$PR_URL" --repo "$GITHUB_REPOSITORY" --add-label sync-upstream
